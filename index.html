<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
       
        body{
            margin: 0;
            padding: 0;
            background-color:antiquewhite;

        }
        .app_name{
            text-align: center;
        }
        .board{
            border: 10px double black;
            display: flex;
            flex-wrap: wrap;
            margin: 50px auto;
            width: 500px;
            align-items: center;
            padding: 40px;
            border-radius: 40px;
            background-color: #fff;
        }
        .cell{
            width: 150px;
            height: 150px;
            border: 1px solid black;
            margin: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
         }
         .cell:hover{
            transition: 0.3s;
            cursor: pointer;
            box-shadow: 0 0 10px 0 black;
         }
         .cell-p1{
            background-color: #ffa725;
         }
         .cell-p2{
            background-color:#ff4e50;
         }
    </style>
</head>
<body>
    <h1 class="app_name">Tic Tac Toe</h1>
<div class="board" id="board">
    <div class="cell cell-p1"></div>
    <div class="cell cell-p2"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
</div>
    <script>
        const board = [-1, 2, -1, 1, -1, -1, 2, -1, 1];

        const cellClass =  {
            1: "cell-p1",
            2: "cell-p2",
        };
        const playerImage ={
            1: "img/arrow.png",
            2: "img/letter-x.png",
        }
        function renderBoard(){
            const boardElement = document.getElementById('board');
            boardElement.innerHTML ='';
            board.forEach((cellValue, index) => {
            boardElement.innerHTML += '<div class="cell ${cellClass[cellValue]}"><img src="${palyerImage[cellValue]}"/></div>';
            });



        }
renderBoard();
     </script>
    
</body>
</html>
