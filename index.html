<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #b9c29c;
        }
        .heading {
            text-align: center;
        }
        .board {
            border: 5px double black;
            display: flex;
            flex-wrap: wrap;
            margin: 50px auto;
            width: 500px;
            justify-content: center;
            align-items: center;
            padding: 30px;
            border-radius: 40px;
            background-color: white;
        }
        .cell {
            width: 150px;
            height: 150px;
            border: 3px solid black;
            margin: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cell:hover {
            transition: 0.3s;
            cursor: pointer;
            box-shadow: 0 0 10px 0 black;
        }
        .cell-p1 {
            background-color: rgb(250, 193, 87);
        }
        .cell-p2 {
            background-color: #E9F5BE;
        }
        .turn {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 class="heading">Tic Tac Toe</h1>
    <p class="turn" id="player">Player Turn</p>

    <div class="board" id="board">
        <div class="cell" class="cell-p1"></div>
        <div class="cell" class="cell-p2"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>
    <script>
        const board=[-1,-1,-1,-1,-1,-1,-1,-1,-1];
        let turn=1;
        const cellClass={
            1:'cell-p1',
            2:'cell-p2',
        };
         const playerImage = {
            1: './img/cross.png',  
            2: './img/circle.png',
        };

        function renderBoard() {
            const boardElement = document.getElementById('board');
            const playerElement = document.getElementById('player');
            boardElement.innerHTML = '';

            playerElement.innerText = `Player ${turn}'s Turn`;

            board.forEach((cellValue, index) => {
                const cell = document.createElement('div');
                cell.className = `cell ${cellClass[cellValue] || ''}`;
                cell.onclick = () => handleTurn(index);

                if (cellValue !== -1) {
                    const img = document.createElement('img');
                    img.src = playerImage[cellValue];
                    img.style.width = '100px';
                    img.style.height = '100px';
                    cell.appendChild(img);
                }

                boardElement.appendChild(cell);
            });
        }

        function handleTurn(cellIndex) {
            if (gameOver) return;
            if (board[cellIndex] === -1) {
                board[cellIndex] = turn;
                if (checkWinner(turn)) {
                    alert(`Player ${turn} wins!`);
                    gameOver = true;
                } else if (!board.includes(-1)) {
                    alert("It's a draw!");
                    gameOver = true;
                } else {
                    turn = turn === 1 ? 2 : 1;
                }
                renderBoard();
            } else {
                alert("Invalid move");
            }
        }

        function checkWinner(player) {
            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
                [0, 4, 8], [2, 4, 6]             // diagonals
            ];

            return winPatterns.some(pattern =>
                pattern.every(index => board[index] === player)
            );
        }

        renderBoard();
    </script>
</body>
</html>
