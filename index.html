<!DOCTYPE html>
<html lang="en">
<head>

    <title>Tic Tac Toe</title>

        body{

        .board{
            border: 10px double black;

            margin: 50px auto;
            width: 500px;
            align-items: center;
            padding: 40px;
            border-radius: 40px;
            background-color: #fff;
        }
        .cell{
            width: 150px;
            height: 150px;
            border: 1px solid black;
            margin: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
         }
         .cell:hover{
            transition: 0.3s;
            cursor: pointer;
            box-shadow: 0 0 10px 0 black;
         }
    </style>
</head>
